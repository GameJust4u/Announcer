<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BL9D LOLKA ANNOUNCER 💬</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
    color: #eee;
  }

  .card {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 24px;
    padding: 40px;
    max-width: 460px;
    width: 90%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    text-align: center;
  }

  h1 {
    font-size: 1.5rem;
    margin-bottom: 8px;
    background: linear-gradient(90deg, #ff6b9d, #a66bff, #4ecdc4);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subtitle { color: #999; font-size: 0.9rem; margin-bottom: 28px; }

  .btn {
    display: block;
    width: 100%;
    padding: 15px 20px;
    margin: 12px 0;
    border: none;
    border-radius: 14px;
    font-size: 1rem;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
  }
  .btn:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.1); }
  .btn:active:not(:disabled) { transform: scale(0.98); }
  .btn:disabled { opacity: 0.5; cursor: wait; }

  .btn-raskopki { background: linear-gradient(135deg, #ff6b9d, #ff8fab); }
  .btn-zasada  { background: linear-gradient(135deg, #a66bff, #8c5eff); }
  .btn-osada   { background: linear-gradient(135deg, #4ecdc4, #44b3aa); }
  .btn-pandora-a { background: linear-gradient(135deg, #ffa62b, #ff7b00); }
  .btn-pandora-b { background: linear-gradient(135deg, #5b8cff, #3d6fe0); }

  .custom-row { display: flex; gap: 10px; margin-top: 20px; }
  .custom-row input {
    flex: 1;
    padding: 14px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-size: 0.95rem;
    outline: none;
  }
  .custom-row input:focus { border-color: #a66bff; }
  .custom-row button {
    padding: 14px 22px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #4ecdc4, #44b3aa);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
  }

  .target-row {
    display: flex;
    gap: 10px;
    margin-top: 10px;
    align-items: center;
  }
  .target-row label { font-size: 0.85rem; color: #999; }
  .target-row select {
    flex: 1;
    padding: 10px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.2);
    background: #16213e;
    color: #eee;
    font-size: 0.9rem;
    outline: none;
  }

  .schedule-row { margin-top: 16px; }
  .schedule-row label { display: block; font-size: 0.85rem; color: #999; margin-bottom: 6px; text-align: left; }
  .schedule-row input {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-size: 0.95rem;
    outline: none;
    color-scheme: dark;
  }
  .schedule-row input:focus { border-color: #ffa62b; }
  .schedule-hint { font-size: 0.75rem; color: #777; margin-top: 6px; text-align: left; }

  .status {
    margin-top: 20px;
    min-height: 24px;
    font-size: 0.9rem;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .status.show { opacity: 1; }
  .status.ok { color: #4ecdc4; }
  .status.err { color: #ff6b9d; }

  /* Экран входа */
  .login-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 10, 20, 0.9);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .login-overlay.show { display: flex; }
  .login-card {
    background: #1c2340;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 36px;
    width: 90%;
    max-width: 380px;
    text-align: center;
  }
  .login-card h2 { margin-bottom: 6px; font-size: 1.2rem; }
  .login-card p { color: #999; font-size: 0.85rem; margin-bottom: 20px; }
  .login-card input {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-size: 1rem;
    outline: none;
    text-align: center;
  }
  .login-card input:focus { border-color: #a66bff; }
  .login-card button {
    width: 100%;
    margin-top: 14px;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #a66bff, #8c5eff);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
  }
  .login-error { color: #ff6b9d; font-size: 0.85rem; margin-top: 10px; min-height: 18px; }

  .footer { margin-top: 20px; font-size: 0.75rem; color: #666; }
</style>
</head>
<body>

<div class="card">
  <h1>BL9D LOLKA ANNOUNCER</h1>
  <p class="subtitle">выбери степень драматизма сообщения</p>

  <button class="btn btn-raskopki" data-button="raskopki">Раскопки</button>
  <button class="btn btn-zasada" data-button="zasada">Засада</button>
  <button class="btn btn-osada" data-button="osada">Осада</button>
  <button class="btn btn-pandora-a" data-button="pandora_a">Пандора А</button>
  <button class="btn btn-pandora-b" data-button="pandora_b">Пандора Б</button>

  <div class="custom-row">
    <input type="text" id="customText" placeholder="Своё сообщение..." maxlength="200">
    <button id="sendCustom">Отправить</button>
  </div>
  <div class="target-row">
    <label>Куда:</label>
    <select id="customTarget">
      <option value="2">Канал 2 (основной)</option>
      <option value="1">Канал 1 (раскопки)</option>
    </select>
  </div>

  <div class="schedule-row">
    <label for="scheduleAt">Отправить по расписанию (необязательно)</label>
    <input type="datetime-local" id="scheduleAt">
    <p class="schedule-hint">если выбрать дату и время — следующий клик по любой кнопке запланирует сообщение, а не отправит сразу</p>
  </div>

  <div class="status" id="status"></div>

  <p class="footer">⚠️ Страничка для своих: ссылку стоит не распространять.</p>
</div>

<!-- Экран входа -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-card">
    <h2>Вход 🔐</h2>
    <p>пароль вводится один раз на этом устройстве</p>
    <input type="password" id="passwordInput" placeholder="Пароль">
    <button id="loginBtn">Войти</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<script>
  const statusEl = document.getElementById('status');
  const loginOverlay = document.getElementById('loginOverlay');
  const scheduleInput = document.getElementById('scheduleAt');

  function showStatus(text, ok) {
    statusEl.textContent = text;
    statusEl.className = 'status show ' + (ok ? 'ok' : 'err');
    setTimeout(() => statusEl.classList.remove('show'), 4000);
  }

  function getScheduleEpoch() {
    const v = scheduleInput.value;
    if (!v) return null;
    const ms = new Date(v).getTime();
    if (!ms || ms <= Date.now()) return null;
    return Math.floor(ms / 1000);
  }

  async function send(opts) {
    const body = { text: opts.text };
    if (opts.button) body.button = opts.button;
    if (opts.target) body.target = opts.target;
    const at = getScheduleEpoch();
    if (at) body.send_at = at;
    try {
      const resp = await fetch('/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (resp.status === 401) {
        loginOverlay.classList.add('show');
        return false;
      }
      if (resp.ok) {
        const data = await resp.json();
        if (data.scheduled) {
          const d = new Date(at * 1000);
          showStatus('Запланировано на ' + d.toLocaleString('ru-RU') + ' ⏰', true);
        } else {
          showStatus('Доставлено! ✅', true);
        }
        scheduleInput.value = '';
        return true;
      }
      showStatus('Не получилось (ошибка ' + resp.status + ')', false);
      return false;
    } catch (e) {
      showStatus('Сервер недоступен', false);
      return false;
    }
  }

  const BUTTON_TEXTS = {
    raskopki: 'Раскопки 🪓',
    zasada: 'Засада 🌙',
    osada: 'Осада 🏰',
    pandora_a: 'Пандора А 🎁',
    pandora_b: 'Пандора Б 🎁'
  };

  document.querySelectorAll('.btn[data-button]').forEach(btn => {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      await send({ button: btn.dataset.button, text: BUTTON_TEXTS[btn.dataset.button] });
      btn.disabled = false;
    });
  });

  async function sendCustom() {
    const input = document.getElementById('customText');
    const text = input.value.trim();
    if (!text) { showStatus('Напиши что-нибудь сначала', false); return; }
    const ok = await send({ text: text, target: document.getElementById('customTarget').value });
    if (ok) input.value = '';
  }
  document.getElementById('sendCustom').addEventListener('click', sendCustom);
  document.getElementById('customText').addEventListener('keydown', e => {
    if (e.key === 'Enter') sendCustom();
  });

  // Вход
  async function doLogin() {
    const pass = document.getElementById('passwordInput').value;
    const errEl = document.getElementById('loginError');
    try {
      const resp = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pass })
      });
      if (resp.ok) {
        loginOverlay.classList.remove('show');
        errEl.textContent = '';
        showStatus('Готово, доступ открыт ✅', true);
      } else {
        errEl.textContent = 'Неверный пароль';
      }
    } catch (e) {
      errEl.textContent = 'Сервер недоступен';
    }
  }
  document.getElementById('loginBtn').addEventListener('click', doLogin);
  document.getElementById('passwordInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
</script>

</body>
</html>
