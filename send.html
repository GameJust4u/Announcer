<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BL9D LOLKA ANNOUNCER 💬</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<meta name="theme-color" content="#16213e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BL9D 💬">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
    color: #eee;
    padding: 20px 0;
  }

  .card {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 24px;
    padding: 40px;
    max-width: 460px;
    width: 90%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    text-align: center;
    margin: auto;
  }

  h1 {
    font-size: 1.5rem;
    margin-bottom: 8px;
    background: linear-gradient(90deg, #ff6b9d, #a66bff, #4ecdc4);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subtitle { color: #999; font-size: 0.9rem; margin-bottom: 28px; }

  .btn {
    display: block;
    width: 100%;
    padding: 15px 20px;
    margin: 12px 0;
    border: none;
    border-radius: 14px;
    font-size: 1rem;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
  }
  .btn:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.1); }
  .btn:active:not(:disabled) { transform: scale(0.98); }
  .btn:disabled { opacity: 0.5; cursor: wait; }

  .btn-raskopki  { background: linear-gradient(135deg, #ff6b9d, #ff8fab); }
  .btn-zasada    { background: linear-gradient(135deg, #a66bff, #8c5eff); }
  .btn-osada     { background: linear-gradient(135deg, #4ecdc4, #44b3aa); }
  .btn-pandora-a { background: linear-gradient(135deg, #ffa62b, #ff7b00); }
  .btn-pandora-b { background: linear-gradient(135deg, #5a8dff, #3a6edd); }

  .custom-row { display: flex; gap: 10px; margin-top: 20px; }
  .custom-row input {
    flex: 1;
    padding: 14px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-size: 0.95rem;
    outline: none;
    min-width: 0;
  }
  .custom-row input:focus { border-color: #a66bff; }
  .custom-row button {
    padding: 14px 22px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #4ecdc4, #44b3aa);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
  }

  .options { display: flex; gap: 10px; margin-top: 14px; }
  .options select, .options input {
    flex: 1;
    padding: 12px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-size: 0.9rem;
    outline: none;
    min-width: 0;
    color-scheme: dark;
  }
  .options select:focus, .options input:focus { border-color: #4ecdc4; }

  .hint { margin-top: 6px; font-size: 0.75rem; color: #777; text-align: left; }

  .status {
    margin-top: 20px;
    min-height: 24px;
    font-size: 0.9rem;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .status.show { opacity: 1; }
  .status.ok { color: #4ecdc4; }
  .status.err { color: #ff6b9d; }

  .footer { margin-top: 20px; font-size: 0.75rem; color: #666; line-height: 1.5; }

  /* Экран входа */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 20, 40, 0.92);
    backdrop-filter: blur(6px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .overlay.show { display: flex; }
  .login-box {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px;
    padding: 32px;
    width: 90%;
    max-width: 340px;
    text-align: center;
  }
  .login-box h2 { font-size: 1.1rem; margin-bottom: 18px; color: #eee; }
  .login-box input {
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-size: 1rem;
    outline: none;
    text-align: center;
    margin-bottom: 14px;
  }
  .login-box input:focus { border-color: #a66bff; }
  .login-box button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #a66bff, #8c5eff);
    color: #fff;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
  }
  .login-err { color: #ff6b9d; font-size: 0.85rem; min-height: 20px; margin-top: 10px; }
</style>
</head>
<body>

<div class="card">
  <h1>BL9D LOLKA ANNOUNCER 💬</h1>
  <p class="subtitle"></p>

  <button class="btn btn-raskopki"  data-id="raskopki">Раскопки</button>
  <button class="btn btn-zasada"    data-id="zasada">Засада</button>
  <button class="btn btn-osada"     data-id="osada">Осада</button>
  <button class="btn btn-pandora-a" data-id="pandora_a">Пандора А</button>
  <button class="btn btn-pandora-b" data-id="pandora_b">Пандора Б</button>

  <div class="custom-row">
    <input type="text" id="customText" placeholder="Своё сообщение..." maxlength="200">
    <button id="sendCustom">Отправить</button>
  </div>

  <div class="options">
    <select id="channel" title="Куда отправить своё сообщение">
      <option value="2">Канал 2 (как Засада/Осада)</option>
      <option value="1">Канал 1 (как Раскопки)</option>
    </select>
    <input type="datetime-local" id="schedule" title="Отправить по расписанию (необязательно)">
  </div>
  <p class="hint">Поле справа — для отложенной отправки. Пусто = отправить сразу.</p>

  <div class="status" id="status"></div>

  <p class="footer">
    📱 На телефоне: меню браузера → «Добавить на главный экран» —
    и страничка будет открываться как приложение.
  </p>
</div>

<div class="overlay" id="overlay">
  <div class="login-box">
    <h2>🔒 Вход в портал</h2>
    <input type="password" id="pwd" placeholder="Пароль" autocomplete="current-password">
    <button id="loginBtn">Войти</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<script>
  const statusEl  = document.getElementById('status');
  const overlay   = document.getElementById('overlay');
  const pwdInput  = document.getElementById('pwd');
  const loginErr  = document.getElementById('loginErr');

  function showStatus(text, ok) {
    statusEl.textContent = text;
    statusEl.className = 'status show ' + (ok ? 'ok' : 'err');
    setTimeout(() => statusEl.classList.remove('show'), 4000);
  }

  function showLogin() { overlay.classList.add('show'); pwdInput.focus(); }
  function hideLogin() { overlay.classList.remove('show'); loginErr.textContent = ''; }

  async function login() {
    const pwd = pwdInput.value;
    if (!pwd) { loginErr.textContent = 'Введи пароль'; return; }
    try {
      const resp = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pwd })
      });
      if (resp.ok) { hideLogin(); pwdInput.value = ''; showStatus('Вход выполнен ✅', true); }
      else { loginErr.textContent = 'Неверный пароль'; }
    } catch (e) {
      loginErr.textContent = 'Сервер недоступен';
    }
  }

  document.getElementById('loginBtn').addEventListener('click', login);
  pwdInput.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

  async function send(text, buttonId, channel) {
    const payload = { text };
    if (buttonId) payload.button = buttonId;
    if (channel)  payload.channel = channel;

    const sched = document.getElementById('schedule').value;
    if (sched) {
      payload.schedule = new Date(sched).toISOString();
      showStatus('Запланировано ⏰', true);
    }

    try {
      const resp = await fetch('/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (resp.ok) {
        if (!sched) showStatus('Доставлено! ✅', true);
        if (!sched) document.getElementById('customText').value = '';
      } else if (resp.status === 401) {
        showLogin();
      } else {
        showStatus('Не получилось (ошибка ' + resp.status + ')', false);
      }
    } catch (e) {
      showStatus('Сервер недоступен', false);
    }
  }

  document.querySelectorAll('.btn[data-id]').forEach(btn => {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      await send('', btn.dataset.id);
      btn.disabled = false;
    });
  });

  document.getElementById('sendCustom').addEventListener('click', () => {
    const input = document.getElementById('customText');
    const text = input.value.trim();
    if (!text) { showStatus('Напиши что-нибудь сначала', false); return; }
    const channel = document.getElementById('channel').value;
    send(text, null, channel);
    input.value = '';
  });

  document.getElementById('customText').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('sendCustom').click();
  });

  // Проверка входа при открытии
  (async () => {
    try {
      const resp = await fetch('/auth-status');
      const data = await resp.json();
      if (!data.authed) showLogin();
    } catch (e) { /* если сервер лег — покажется при отправке */ }
  })();
</script>

</body>
</html>
