<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BL9D 💬</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="theme-color" content="#0f1420">
<style>
:root{
  --bg:#0f1420; --panel:#1a2233; --panel2:#202b42; --line:#2c3a58;
  --text:#e8edf7; --muted:#8fa0bf; --gold:#ffd166; --green:#4ade80;
  --red:#f87171; --accent:#5b8cff;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;
  padding:14px;max-width:560px;margin:0 auto;padding-bottom:40px}
h1{font-size:1.5rem;margin-bottom:10px}
.topbar{display:flex;gap:8px;margin-bottom:16px}
h2{font-size:.95rem;color:var(--gold);margin:18px 0 8px;letter-spacing:.03em}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;
  padding:13px 14px;font-size:1rem;cursor:pointer;width:100%;text-align:left;transition:.15s}
.btn:hover{background:var(--panel2)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{width:auto;padding:8px 14px;font-size:.9rem;border-radius:10px}
.btn.login{border-color:var(--accent);color:var(--accent);background:transparent}
.btn.logout{border-color:var(--line);color:var(--muted);background:transparent}
.events{display:grid;gap:8px}
.btn .cd{color:var(--red);font-weight:700}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px}
label{display:block;font-size:.82rem;color:var(--muted);margin:10px 0 4px}
textarea,select,input{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);
  border-radius:10px;padding:10px;font-size:1rem;font-family:inherit}
textarea{resize:vertical;min-height:70px}
.send{margin-top:12px;background:var(--accent);border:none;color:#fff;font-weight:600}
.pending{display:grid;gap:8px}
.pend-item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;
  display:flex;gap:10px;align-items:center}
.pend-when{color:var(--gold);font-weight:700;white-space:nowrap;font-size:.95rem}
.pend-body{flex:1;min-width:0}
.pend-text{font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pend-ch{font-size:.75rem;color:var(--muted)}
.pend-x{border:1px solid var(--line);background:transparent;color:var(--red);border-radius:8px;
  padding:6px 10px;cursor:pointer;font-size:.85rem}
.empty{color:var(--muted);font-size:.88rem;font-style:italic}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel2);
  border:1px solid var(--line);border-radius:12px;padding:10px 18px;font-size:.92rem;z-index:50;
  max-width:90vw;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.toast.ok{border-color:var(--green)}
.toast.err{border-color:var(--red)}
.modal{position:fixed;inset:0;background:rgba(5,8,15,.75);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;width:100%;max-width:340px}
.modal h3{margin-bottom:12px}
.modal .row{display:flex;gap:8px;margin-top:12px}
.hint{color:var(--muted);font-size:.82rem;margin-top:18px}
.err-msg{color:var(--red);font-size:.85rem;margin-top:6px;min-height:1em}
</style>
</head>
<body>

<div class="topbar">
  <h1 style="flex:1">BL9D 💬</h1>
  <button class="btn small login" id="btnLoginTop">Вход 🔑</button>
  <button class="btn small logout" id="btnLogout" style="display:none">Выйти</button>
</div>

<h2>⚡ Быстрые события</h2>
<div class="events" id="events"></div>

<h2>✍️ Своё сообщение</h2>
<div class="card">
  <label for="msgText">Текст</label>
  <textarea id="msgText" maxlength="1800" placeholder="Что отправить в Discord…"></textarea>
  <label for="msgChan">Куда:</label>
  <select id="msgChan">
    <option value="1">Канал 1 (Раскопки)</option>
    <option value="2">Канал 2 (события)</option>
  </select>
  <label for="msgWhen">По расписанию (необязательно):</label>
  <input type="datetime-local" id="msgWhen">
  <button class="btn send" id="btnSendCustom">Отправить</button>
  <div class="err-msg" id="customErr"></div>
</div>

<h2>⏳ Запланированные отправки</h2>
<div class="pending" id="pending"></div>

<div class="hint">📱 На телефоне: меню браузера → «Добавить на главный экран» — и страничка станет приложением с иконкой.</div>

<!-- Модалка входа -->
<div class="modal" id="loginModal" style="display:none">
  <div class="box">
    <h3>Вход 🔑</h3>
    <input type="password" id="pwd" placeholder="Пароль" autocomplete="current-password">
    <div class="err-msg" id="loginErr"></div>
    <div class="row">
      <button class="btn send" id="btnDoLogin" style="flex:1">Войти</button>
      <button class="btn small logout" id="btnLater" style="flex:1">Позже</button>
    </div>
  </div>
</div>

<script>
const EVENTS = {
  excavations:{label:'⛏️ Раскопки'},
  ambush:{label:'🏹 Засада'},
  siege:{label:'🏰 Осада'},
  pandora_a:{label:'📦 Пандора А'},
  pandora_b:{label:'📦 Пандора Б'},
};
const GUEST_ONLY = 'excavations'; // гостю доступна только эта

let AUTHED=false, GUEST_MODE=false;
let cooldowns={};   // key -> секунд осталось
let busy=new Set(); // кнопки, по которым идёт запрос

const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function toast(msg, cls){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t=document.createElement('div');
  t.className='toast '+(cls||'');
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 3500);
}

function localISO(value){
  const d=new Date(value);
  const off=-d.getTimezoneOffset();
  const sign=off>=0?'+':'-';
  const h=String(Math.floor(Math.abs(off)/60)).padStart(2,'0');
  const m=String(Math.abs(off)%60).padStart(2,'0');
  const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}${sign}${h}:${m}`;
}

/* ---------- рендер кнопок событий ---------- */
function renderEvents(){
  const box=$('events');
  box.innerHTML='';
  for(const [key,ev] of Object.entries(EVENTS)){
    const locked = GUEST_MODE && !AUTHED && key!==GUEST_ONLY;
    const cd = cooldowns[key]||0;
    const b=document.createElement('button');
    b.className='btn';
    b.dataset.key=key;
    b.innerHTML = ev.label + (locked?' 🔒':'') + (cd>0?` <span class="cd">⏳ ${cd}с</span>`:'');
    b.disabled = cd>0 || busy.has(key);
    b.onclick=()=>clickEvent(key);
    box.appendChild(b);
  }
}

/* ---------- клик по событию ---------- */
async function clickEvent(key){
  if(GUEST_MODE && !AUTHED && key!==GUEST_ONLY){ openLogin(); return; }
  busy.add(key); renderEvents();
  try{
    const r=await fetch('/api/send',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({button:key})
    });
    const d=await r.json().catch(()=>({}));
    if(r.ok){
      toast(d.scheduled? 'Запланировано не было — отправлено сейчас ✅' : 'Отправлено ✅','ok');
    }else if(r.status===429 && d.wait){
      cooldowns[key]=d.wait;
    }else if(r.status===401){
      openLogin(); toast(d.error||'нужен вход','err');
    }else{
      toast(d.error||'ошибка отправки','err');
    }
  }catch(e){ toast('нет связи с сервером','err'); }
  busy.delete(key);
  refreshState();
}

/* ---------- своё сообщение ---------- */
$('btnSendCustom').onclick=async()=>{
  const err=$('customErr'); err.textContent='';
  const text=$('msgText').value.trim();
  if(!text){ err.textContent='Введите текст сообщения'; return; }
  const whenRaw=$('msgWhen').value;
  let scheduled='';
  if(whenRaw){
    const d=new Date(whenRaw);
    if(d.getTime() < Date.now()+6000){ err.textContent='Время уже прошло'; return; }
    scheduled=localISO(d);
  }
  if(GUEST_MODE && !AUTHED){ openLogin(); return; }
  $('btnSendCustom').disabled=true;
  try{
    const r=await fetch('/api/send',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({button:'custom',text,channel:$('msgChan').value,scheduled})
    });
    const d=await r.json().catch(()=>({}));
    if(r.ok){
      toast(d.scheduled? `Запланировано на ${d.scheduled} ⏳` : 'Отправлено ✅','ok');
      $('msgText').value=''; $('msgWhen').value='';
    }else if(r.status===429 && d.wait){
      toast(`Слишком часто — подождите ${d.wait} с`,'err');
    }else{
      err.textContent=d.error||'ошибка';
      toast(d.error||'ошибка отправки','err');
    }
  }catch(e){ err.textContent='нет связи с сервером'; }
  $('btnSendCustom').disabled=false;
  refreshState();
};

/* ---------- состояние: отложенные + кулдауны ---------- */
async function refreshState(){
  try{
    const r=await fetch('/api/state',{cache:'no-store'});
    if(!r.ok) return;
    const d=await r.json();
    AUTHED=d.authed;
    cooldowns=d.cooldowns||{};
    renderEvents(); renderAuth(); renderPending(d.pending||[]);
  }catch(e){}
}

function renderPending(list){
  const box=$('pending');
  if(!list.length){ box.innerHTML='<div class="empty">Пока ничего не запланировано</div>'; return; }
  box.innerHTML='';
  for(const p of list){
    const item=document.createElement('div');
    item.className='pend-item';
    item.innerHTML=`<div class="pend-when">${esc(p.when)}</div>
      <div class="pend-body"><div class="pend-text">${esc(p.text)}</div><div class="pend-ch">${esc(p.channel)}</div></div>`;
    if(AUTHED){
      const x=document.createElement('button');
      x.className='pend-x'; x.textContent='✕ Отменить'; x.title='Отменить отправку';
      x.onclick=async()=>{
        if(!confirm('Отменить отправку «'+p.text.slice(0,60)+'» на '+p.when+'?')) return;
        const r=await fetch('/api/cancel',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({key:p.key})});
        if(r.ok) toast('Отправка отменена','ok');
        else{ const d=await r.json().catch(()=>({})); toast(d.error||'не удалось отменить','err'); }
        refreshState();
      };
      item.appendChild(x);
    }
    box.appendChild(item);
  }
}

/* ---------- вход/выход ---------- */
function renderAuth(){
  $('btnLoginTop').style.display = AUTHED?'none':'';
  $('btnLogout').style.display = AUTHED?'':'none';
}
function openLogin(){ $('loginModal').style.display='flex'; $('pwd').value=''; $('loginErr').textContent=''; $('pwd').focus(); }
$('btnLoginTop').onclick=openLogin;
$('btnLater').onclick=()=>$('loginModal').style.display='none';
$('btnDoLogin').onclick=doLogin;
$('pwd').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });
async function doLogin(){
  $('loginErr').textContent='';
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({password:$('pwd').value})});
    if(r.ok){ $('loginModal').style.display='none'; toast('Вы вошли 🔓','ok'); refreshState(); }
    else{ const d=await r.json().catch(()=>({})); $('loginErr').textContent=d.error||'неверный пароль'; }
  }catch(e){ $('loginErr').textContent='нет связи с сервером'; }
}
$('btnLogout').onclick=()=>{
  document.cookie='session=; Max-Age=0; Path=/';
  toast('Вы вышли из режима доступа');
  refreshState();
};

/* ---------- таймер кулдаунов ---------- */
setInterval(()=>{
  let changed=false;
  for(const k in cooldowns){
    if(--cooldowns[k]<=0){ delete cooldowns[k]; }
    changed=true;
  }
  if(changed) renderEvents();
},1000);

/* ---------- старт ---------- */
(async()=>{
  try{
    const r=await fetch('/api/auth',{cache:'no-store'});
    const d=await r.json();
    GUEST_MODE=d.guest_mode;
    AUTHED=d.authed;
    if(GUEST_MODE && !AUTHED) openLogin();
  }catch(e){}
  renderAuth();
  refreshState();
  setInterval(refreshState, 15000);
})();
</script>
</body>
</html>
