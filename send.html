<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BL9D LOLKA ANNOUNCER 💬</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
    color: #eee;
  }

  .card {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 24px;
    padding: 40px;
    max-width: 460px;
    width: 90%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    text-align: center;
  }

  h1 {
    font-size: 1.5rem;
    margin-bottom: 8px;
    background: linear-gradient(90deg, #ff6b9d, #a66bff, #4ecdc4);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subtitle { color: #999; font-size: 0.9rem; margin-bottom: 28px; }

  .btn {
    display: block;
    width: 100%;
    padding: 15px 20px;
    margin: 12px 0;
    border: none;
    border-radius: 14px;
    font-size: 1rem;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
  }
  .btn:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.1); }
  .btn:active:not(:disabled) { transform: scale(0.98); }
  .btn:disabled { opacity: 0.5; cursor: wait; }

  .btn-1 { background: linear-gradient(135deg, #ff6b9d, #ff8fab); }
  .btn-2 { background: linear-gradient(135deg, #a66bff, #8c5eff); }
  .btn-3 { background: linear-gradient(135deg, #4ecdc4, #44b3aa); }
  .btn-4 { background: linear-gradient(135deg, #ffa62b, #ff7b00); }
  .btn-5 { background: linear-gradient(135deg, #5c7cfa, #4c6ef5); }

  .custom-row { display: flex; gap: 10px; margin-top: 20px; }
  .custom-row input {
    flex: 1;
    padding: 14px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-size: 0.95rem;
    outline: none;
  }
  .custom-row input:focus { border-color: #a66bff; }
  .custom-row button {
    padding: 14px 22px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #4ecdc4, #44b3aa);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
  }

  .status {
    margin-top: 20px;
    min-height: 24px;
    font-size: 0.9rem;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .status.show { opacity: 1; }
  .status.ok { color: #4ecdc4; }
  .status.err { color: #ff6b9d; }

  /* Экран входа */
  .login {
    position: fixed;
    inset: 0;
    background: rgba(10, 10, 20, 0.85);
    backdrop-filter: blur(6px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .login.show { display: flex; }
  .login .card { max-width: 360px; }
  .login input {
    width: 100%;
    padding: 14px;
    margin: 10px 0 0;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-size: 1rem;
    outline: none;
    text-align: center;
  }
  .login input:focus { border-color: #a66bff; }
  .login button { margin-top: 12px; }
</style>
</head>
<body>

<!-- Экран входа: показывается, только если пароль ещё не введён -->
<div class="login" id="login">
  <div class="card">
    <h1>BL9D LOLKA ANNOUNCER</h1>
    <p class="subtitle">введите код доступа — только один раз</p>
    <input type="password" id="pwd" placeholder="Пароль" autocomplete="current-password">
    <button class="btn btn-2" id="loginBtn">Войти</button>
    <div class="status" id="loginStatus"></div>
  </div>
</div>

<div class="card" id="main">
  <h1>BL9D LOLKA ANNOUNCER 💬</h1>
  <p class="subtitle">выбери степень драматизма сообщения</p>

  <button class="btn btn-1" data-text="@everyone РАСКОПКИ — ЛОПАТЫ К БОЮ">Раскопки</button>
  <button class="btn btn-2" data-text="@everyone 🪤 ЗАСАДА ЧЕРЕЗ 5 МИНУТ — ЖДЁМ ВСЕХ 🪤">Засада</button>
  <button class="btn btn-3" data-text="@everyone 🏰 ОСАДА ЧЕРЕЗ 5 МИНУТ — ВСТАЁМ НА ЗАЩИТУ 🏰">Осада</button>
  <button class="btn btn-4" data-text="@everyone ⚔️ ПАНДОРА А ЧЕРЕЗ 5 МИНУТ — ГОТОВИМСЯ ⚔️">Пандора А</button>
  <button class="btn btn-5" data-text="@everyone ⚔️ ПАНДОРА Б ЧЕРЕЗ 5 МИНУТ — ГОТОВИМСЯ ⚔️">Пандора Б</button>

  <div class="custom-row">
    <input type="text" id="customText" placeholder="Своё сообщение..." maxlength="200">
    <button id="sendCustom">Отправить</button>
  </div>

  <div class="status" id="status"></div>
</div>

<script>
  const statusEl = document.getElementById('status');
  const loginEl = document.getElementById('login');
  const loginStatusEl = document.getElementById('loginStatus');

  function showStatus(el, text, ok) {
    el.textContent = text;
    el.className = 'status show ' + (ok ? 'ok' : 'err');
    setTimeout(() => el.classList.remove('show'), 4000);
  }

  async function send(text) {
    try {
      const resp = await fetch('/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
      });
      if (resp.status === 401) {
        // Кука кончилась или сбросилась — просим войти заново
        loginEl.classList.add('show');
        showStatus(statusEl, 'Нужен вход', false);
        return;
      }
      if (resp.ok) {
        showStatus(statusEl, 'Доставлено! ✅', true);
      } else {
        showStatus(statusEl, 'Не получилось (ошибка ' + resp.status + ')', false);
      }
    } catch (e) {
      showStatus(statusEl, 'Сервер недоступен', false);
    }
  }

  document.querySelectorAll('#main .btn[data-text]').forEach(btn => {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      await send(btn.dataset.text);
      btn.disabled = false;
    });
  });

  document.getElementById('sendCustom').addEventListener('click', () => {
    const input = document.getElementById('customText');
    const text = input.value.trim();
    if (!text) { showStatus(statusEl, 'Напиши что-нибудь сначала', false); return; }
    send(text);
    input.value = '';
  });

  // --- вход ---
  async function login() {
    const pwd = document.getElementById('pwd');
    const password = pwd.value;
    if (!password) { showStatus(loginStatusEl, 'Введите пароль', false); return; }
    try {
      const resp = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password })
      });
      if (resp.ok) {
        loginEl.classList.remove('show');
        pwd.value = '';
      } else {
        showStatus(loginStatusEl, 'Неверный пароль', false);
      }
    } catch (e) {
      showStatus(loginStatusEl, 'Сервер недоступен', false);
    }
  }

  document.getElementById('loginBtn').addEventListener('click', login);
  document.getElementById('pwd').addEventListener('keydown', e => {
    if (e.key === 'Enter') login();
  });

  // При открытии проверяем, авторизованы ли мы уже
  (async () => {
    try {
      const resp = await fetch('/check');
      const data = await resp.json();
      if (!data.ok) loginEl.classList.add('show');
    } catch (e) {
      showStatus(statusEl, 'Сервер недоступен', false);
    }
  })();
</script>

</body>
</html>
