<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BL9D LOLKA ANNOUNCER 💬</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
    color: #eee;
  }

  .card {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 24px;
    padding: 40px;
    max-width: 460px;
    width: 90%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    text-align: center;
  }

  h1 {
    font-size: 1.5rem;
    margin-bottom: 8px;
    background: linear-gradient(90deg, #ff6b9d, #a66bff, #4ecdc4);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subtitle { color: #999; font-size: 0.9rem; margin-bottom: 28px; }

  .btn {
    display: block;
    width: 100%;
    padding: 15px 20px;
    margin: 12px 0;
    border: none;
    border-radius: 14px;
    font-size: 1rem;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
  }
  .btn:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.1); }
  .btn:active:not(:disabled) { transform: scale(0.98); }
  .btn:disabled { opacity: 0.5; cursor: wait; }

  .btn-1 { background: linear-gradient(135deg, #e74c3c, #c0392b); }
  .btn-2 { background: linear-gradient(135deg, #27ae60, #1e8449); }
  .btn-3 { background: linear-gradient(135deg, #8e44ad, #6c3483); }
  .btn-4 { background: linear-gradient(135deg, #ffa62b, #ff7b00); }
  .btn-5 { background: linear-gradient(135deg, #3498db, #2c81ba); }

  .custom-row { display: flex; gap: 10px; margin-top: 20px; }
  .custom-row input {
    flex: 1;
    padding: 14px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-size: 0.95rem;
    outline: none;
  }
  .custom-row input:focus { border-color: #a66bff; }
  .custom-row button {
    padding: 14px 22px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #4ecdc4, #44b3aa);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
  }

  .pass-row {
    margin-top: 16px;
  }
  .pass-row input {
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-size: 0.95rem;
    outline: none;
    text-align: center;
  }
  .pass-row input:focus { border-color: #a66bff; }

  .status {
    margin-top: 20px;
    min-height: 24px;
    font-size: 0.9rem;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .status.show { opacity: 1; }
  .status.ok { color: #4ecdc4; }
  .status.err { color: #ff6b9d; }
</style>
</head>
<body>

<div class="card">
  <h1>BL9D LOLKA ANNOUNCER 💬</h1>
  <p class="subtitle">выбери ивент — бот объявит в канал</p>

  <button class="btn btn-1" data-text="@everyone РАСКОПКИ! Cобираемся на раскопочки!">Раскопки</button>
  <button class="btn btn-2" data-text="@everyone 🗡️ ИВЕНТ: ЗАСАДА! Собираемся на засаду, тихо и слаженно!">Засада</button>
  <button class="btn btn-3" data-text="@everyone 🏰 ИВЕНТ: ОСАДА! Все на осаду, не спим!">Осада</button>
  <button class="btn btn-4" data-text="@everyone ⚔️ ИВЕНТ: ПАНДОРА А! Сбор группы на Пандору, первый состав!">Пандора А</button>
  <button class="btn btn-5" data-text="@everyone ⚔️ ИВЕНТ: ПАНДОРА Б! Сбор группы на Пандору, второй состав!">Пандора Б</button>

  <div class="custom-row">
    <input type="text" id="customText" placeholder="Своё сообщение..." maxlength="200">
    <button id="sendCustom">Отправить</button>
  </div>

  <div class="pass-row">
    <input type="password" id="password" placeholder="Пароль" autocomplete="off">
  </div>

  <div class="status" id="status"></div>
</div>

<script>
  const statusEl = document.getElementById('status');
  const passEl = document.getElementById('password');

  function showStatus(text, ok) {
    statusEl.textContent = text;
    statusEl.className = 'status show ' + (ok ? 'ok' : 'err');
    setTimeout(() => statusEl.classList.remove('show'), 4000);
  }

  async function send(text) {
    const password = passEl.value;
    if (!password) { showStatus('Сначала введи пароль 🔑', false); return false; }
    try {
      const resp = await fetch('/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, password })
      });
      if (resp.ok) {
        showStatus('Доставлено! ✅', true);
        return true;
      } else if (resp.status === 401) {
        showStatus('Неверный пароль', false);
      } else {
        showStatus('Не получилось (ошибка ' + resp.status + ')', false);
      }
    } catch (e) {
      showStatus('Сервер недоступен', false);
    }
    return false;
  }

  document.querySelectorAll('.btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      await send(btn.dataset.text);
      btn.disabled = false;
    });
  });

  async function sendCustom() {
    const input = document.getElementById('customText');
    const text = input.value.trim();
    if (!text) { showStatus('Напиши что-нибудь сначала', false); return; }
    if (await send(text)) input.value = '';
  }
  document.getElementById('sendCustom').addEventListener('click', sendCustom);
  document.getElementById('customText').addEventListener('keydown', e => {
    if (e.key === 'Enter') sendCustom();
  });
</script>

</body>
</html>
