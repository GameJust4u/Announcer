<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1420">
<title>BL9D 💬</title>
<link rel="manifest" href="/manifest.webmanifest">
<style>
  :root{
    --bg:#0f1420; --panel:#171e2e; --panel2:#1d2638; --line:#2a3550;
    --text:#e8edf7; --muted:#8fa0bd; --accent:#f5b942; --ok:#3ecf8e; --err:#ff6b6b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;padding:14px 14px 60px}
  header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
  h1{font-size:1.25rem;margin:0;letter-spacing:.5px}
  .topbtns{display:flex;gap:8px}
  button{font:inherit;border-radius:10px;border:1px solid var(--line);cursor:pointer;
    background:var(--panel2);color:var(--text);padding:10px 12px;transition:filter .15s, opacity .15s}
  button:hover:not(:disabled){filter:brightness(1.15)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .btn-primary{background:linear-gradient(135deg,#f5b942,#e09a1e);color:#1a1206;font-weight:700;border-color:transparent}
  .btn-block{width:100%}
  section{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
  h2{font-size:.95rem;margin:0 0 10px;color:var(--accent);text-transform:uppercase;letter-spacing:.8px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  label{display:block;font-size:.8rem;color:var(--muted);margin:10px 0 4px}
  input,select,textarea{font:inherit;width:100%;background:#101726;color:var(--text);
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--accent)}
  textarea{min-height:70px;resize:vertical}
  .cd{font-weight:700}
  .flash{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
    background:#20304d;border:1px solid var(--line);color:var(--text);
    padding:10px 16px;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.5);
    opacity:0;pointer-events:none;transition:opacity .25s;max-width:92vw;z-index:50}
  .flash.show{opacity:1}
  .flash.err{background:#3d1f24;border-color:var(--err)}
  .modal{position:fixed;inset:0;background:rgba(5,8,14,.7);display:flex;
    align-items:center;justify-content:center;padding:16px;z-index:40}
  .modal[hidden]{display:none}
  .modal-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:18px;width:100%;max-width:340px}
  .modal-card h2{margin-bottom:4px}
  .pending-item{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;
    background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px}
  .pending-when{color:var(--accent);font-weight:700;white-space:nowrap}
  .pending-text{font-size:.85rem;color:var(--text);word-break:break-word}
  .pending-ch{font-size:.75rem;color:var(--muted)}
  .pending-del{padding:4px 10px;font-size:.8rem;flex-shrink:0}
  .muted{color:var(--muted);font-size:.85rem}
  .lock{opacity:.55}
  .pwa{font-size:.8rem;color:var(--muted);text-align:center;margin-top:6px}
  .err-note{color:var(--err);font-size:.85rem;margin-top:6px}
</style>
</head>
<body>
<header>
  <h1>BL9D 💬</h1>
  <div class="topbtns">
    <button id="btnLoginTop">Вход 🔑</button>
    <button id="btnLogout" hidden>Выйти</button>
  </div>
</header>

<section>
  <h2>⚡ Быстрые события</h2>
  <div class="grid">
    <button class="btn-block" data-key="excavations">⛏️ Раскопки</button>
    <button class="btn-block lock" data-key="ambush" data-guest="1">🏹 Засада 🔒</button>
    <button class="btn-block lock" data-key="siege" data-guest="1">🏰 Осада 🔒</button>
    <button class="btn-block lock" data-key="pandora_a" data-guest="1">📦 Пандора А 🔒</button>
    <button class="btn-block lock" data-key="pandora_b" data-guest="1">📦 Пандора Б 🔒</button>
  </div>
</section>

<section>
  <h2>✉️ Своё сообщение</h2>
  <label for="customText">Текст объявления</label>
  <textarea id="customText" maxlength="1800" placeholder="Например: раскопки через 10 минут, сбор у склада"></textarea>
  <label for="customChannel">Куда</label>
  <select id="customChannel">
    <option value="2">Канал ивентов</option>
    <option value="1">Канал раскопок</option>
  </select>
  <label for="schedTime">По расписанию (не обязательно)</label>
  <input type="datetime-local" id="schedTime">
  <div style="margin-top:12px">
    <button class="btn-primary btn-block" id="btnCustom">Отправить</button>
  </div>
</section>

<section id="pendingSec">
  <h2>⏳ Запланированные отправки</h2>
  <div id="pendingEmpty" class="muted">Пока ничего не запланировано.</div>
  <div id="pendingList"></div>
</section>

<p class="pwa">📱 На телефоне: меню браузера → «Добавить на главный экран» — и страничка станет приложением с иконкой.</p>

<div class="modal" id="loginModal" hidden>
  <div class="modal-card">
    <h2>Вход</h2>
    <label for="pwd">Пароль</label>
    <input type="password" id="pwd" autocomplete="current-password">
    <div id="loginErr" class="err-note" hidden></div>
    <div class="grid" style="margin-top:12px">
      <button id="btnLoginOk">Войти</button>
      <button id="btnLoginLater">Позже</button>
    </div>
  </div>
</div>

<div class="flash" id="flash"></div>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var authed = false, guestMode = true;
  var timers = {}; // key -> interval
  var cancels = {}; // id -> in-flight

  // ---------- утилиты ----------
  function flash(msg, isErr){
    var f = $("flash");
    f.textContent = msg;
    f.className = "flash show" + (isErr ? " err" : "");
    clearTimeout(flash._t);
    flash._t = setTimeout(function(){ f.className = "flash"; }, 3500);
  }

  function api(path, opts){
    return fetch(path, opts || {}).then(function(r){
      return r.json().then(function(j){ j._code = r.status; return j; });
    });
  }

  // ГЛАВНЫЙ ФИКС: datetime-local отдаёт время БЕЗ пояса.
  // Достраиваем пояс из самого устройства, иначе сервер отвечает «время без пояса».
  function isoWithTz(v){
    if(!v) return null;
    var d = new Date(v);
    if (isNaN(d.getTime())) return null;
    var off = -d.getTimezoneOffset();
    var sign = off >= 0 ? "+" : "-";
    var abs = Math.abs(off);
    var pad = function(n){ return String(n).length < 2 ? "0"+n : ""+n; };
    return v + (v.length === 16 ? ":00" : "") + sign + pad(Math.floor(abs/60)) + ":" + pad(abs%60);
  }

  // ---------- кулдауны ----------
  function setCooldown(key, secs){
    clearTimeoutCd(key);
    var btn = document.querySelector('button[data-key="'+key+'"]');
    if (btn){
      var label = btn.getAttribute("data-label") || btn.textContent;
      btn.setAttribute("data-label", label);
      btn.disabled = true;
      var left = secs;
      var tick = function(){
        if (left > 0){
          btn.textContent = "⏳ " + left + "с";
          left--;
        } else {
          clearTimeoutCd(key);
          btn.textContent = btn.getAttribute("data-label");
          btn.disabled = shouldLock(key);
        }
      };
      tick();
      timers[key] = setInterval(tick, 1000);
    }
  }
  function clearTimeoutCd(key){
    if (timers[key]){ clearInterval(timers[key]); delete timers[key]; }
  }
  function shouldLock(key){
    if (key === "excavations") return false;
    return guestMode && !authed;
  }

  function applyCooldowns(cds){
    Object.keys(cds).forEach(function(k){ setCooldown(k, cds[k]); });
    // кнопки без кулдауна — в исходное состояние
    document.querySelectorAll("button[data-key]").forEach(function(b){
      var k = b.getAttribute("data-key");
      if (!timers[k] && !b.disabled){
        b.textContent = b.getAttribute("data-label") || b.textContent;
        b.disabled = shouldLock(k);
      }
    });
  }

  // ---------- запланированные отправки ----------
  function esc(s){
    var d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }
  function renderPending(items){
    var list = $("pendingList"), empty = $("pendingEmpty");
    list.innerHTML = "";
    if (!items.length){ empty.hidden = false; return; }
    empty.hidden = true;
    items.forEach(function(it){
      var row = document.createElement("div");
      row.className = "pending-item";
      var body = document.createElement("div");
      var when = document.createElement("div");
      when.className = "pending-when";
      when.textContent = it.when + " · к." + it.channel;
      var txt = document.createElement("div");
      txt.className = "pending-text";
      txt.innerHTML = it.text ? esc(it.text) : '<span class="muted">своё сообщение</span>';
      body.appendChild(when); body.appendChild(txt);
      row.appendChild(body);
      if (authed){
        var del = document.createElement("button");
        del.className = "pending-del";
        del.textContent = "✕";
        del.onclick = function(){ cancelPending(it.id, row, del); };
        row.appendChild(del);
      }
      list.appendChild(row);
    });
  }

  function cancelPending(id, row, del){
    if (cancels[id]) return;
    cancels[id] = true;
    del.disabled = true;
    api("/api/cancel", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({id: id})
    }).then(function(j){
      if (j.ok) flash("Отменено");
      else flash(j.error || "Не удалось отменить", true);
      loadState();
    }).catch(function(){ flash("Нет связи с сервером", true); })
    .finally(function(){ delete cancels[id]; del.disabled = false; });
  }

  // ---------- состояние ----------
  function applyAuth(){
    $("btnLoginTop").hidden = authed;
    $("btnLogout").hidden = !authed;
    document.querySelectorAll("button[data-key]").forEach(function(b){
      var k = b.getAttribute("data-key");
      if (k !== "excavations") b.classList.toggle("lock", !authed);
      if (!timers[k]) b.disabled = shouldLock(k);
    });
  }

  function loadState(){
    return api("/api/state").then(function(j){
      authed = !!j.authed;
      guestMode = !!j.guest_mode;
      applyAuth();
      applyCooldowns(j.cooldowns || {});
      renderPending(j.pending || []);
    }).catch(function(){
      // сервер недоступен или старая версия без /api/state —
      // страничка продолжает работать, просто без окна и кулдаунов
      $("pendingList").innerHTML = "";
      $("pendingEmpty").hidden = false;
      $("pendingEmpty").textContent = "Не удалось получить состояние сервера.";
    });
  }

  // ---------- вход / выход ----------
  function openLogin(){ $("loginModal").hidden = false; $("loginErr").hidden = true; $("pwd").value = ""; $("pwd").focus(); }
  $("btnLoginTop").onclick = openLogin;
  $("btnLoginLater").onclick = function(){ $("loginModal").hidden = true; };
  $("btnLoginOk").onclick = function(){
    var pwd = $("pwd").value;
    api("/api/login", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({password: pwd})
    }).then(function(j){
      if (j.ok){
        $("loginModal").hidden = true;
        flash("Вы вошли");
        loadState();
      } else {
        $("loginErr").textContent = j.error || "Не удалось войти";
        $("loginErr").hidden = false;
      }
    }).catch(function(){ flash("Нет связи с сервером", true); });
  };
  $("pwd").addEventListener("keydown", function(e){ if (e.key === "Enter") $("btnLoginOk").click(); });

  $("btnLogout").onclick = function(){
    api("/api/logout", {method: "POST"}).then(function(){
      flash("Вы вышли");
      loadState();
    }).catch(function(){ flash("Нет связи с сервером", true); });
  };

  // ---------- быстрые кнопки ----------
  document.querySelectorAll("button[data-key]").forEach(function(btn){
    btn.setAttribute("data-label", btn.textContent);
    btn.onclick = function(){
      if (btn.disabled) return;
      var key = btn.getAttribute("data-key");
      api("/api/send", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({button: key})
      }).then(function(j){
        if (j.ok){ flash("Отправлено ✔"); loadState(); }
        else if (j._code === 429){ setCooldown(key, j.wait || 15); flash("Слишком часто", true); }
        else if (j._code === 401){ openLogin(); flash(j.error || "Нужен вход", true); }
        else flash(j.error || "Ошибка отправки", true);
      }).catch(function(){ flash("Нет связи с сервером", true); });
    };
  });

  // ---------- своё сообщение ----------
  $("btnCustom").onclick = function(){
    var text = $("customText").value.trim();
    if (!text){ flash("Введите текст сообщения", true); return; }
    var sched = isoWithTz($("schedTime").value);
    var body = {button: "custom", text: text, channel: parseInt($("customChannel").value, 10)};
    if (sched) body.scheduled = sched;
    api("/api/send", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body)
    }).then(function(j){
      if (j.ok){
        flash(sched ? ("Запланировано на " + (j.scheduled || "")) : "Отправлено ✔");
        if (!sched){ $("customText").value = ""; }
        loadState();
      }
      else if (j._code === 429){ setCooldown("custom", j.wait || 15); flash("Слишком часто", true); }
      else if (j._code === 401){ openLogin(); flash(j.error || "Нужен вход", true); }
      else flash(j.error || "Ошибка отправки", true);
    }).catch(function(){ flash("Нет связи с сервером", true); });
  };

  // ---------- старт ----------
  loadState();
  setInterval(loadState, 15000);
})();
</script>
</body>
</html>
