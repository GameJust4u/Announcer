<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BL9D 💬</title>
<link rel="manifest" href="/manifest.webmanifest">
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --card2:#1e222c; --line:#2a2f3c;
    --text:#e8eaf0; --muted:#8b93a5; --gold:#f0b429; --green:#4cc38a; --red:#ff6b6b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       padding:16px;max-width:560px;margin:0 auto}
  h1{font-size:1.4em;margin:.2em 0 .6em}
  .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .top .btn{padding:8px 14px}
  .section{background:var(--card);border:1px solid var(--line);border-radius:14px;
           padding:14px;margin:14px 0}
  .section h2{font-size:1.05em;margin:0 0 10px;color:var(--gold)}
  .btn{display:block;width:100%;padding:13px 14px;margin:8px 0;border:none;border-radius:10px;
       background:var(--card2);color:var(--text);font-size:1em;text-align:left;cursor:pointer;
       border:1px solid var(--line);transition:opacity .15s}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn .cd{color:var(--gold);font-size:.9em}
  .lock{opacity:.6;font-size:.85em}
  .row{display:flex;gap:8px;align-items:center;margin:10px 0;flex-wrap:wrap}
  .row label{color:var(--muted);font-size:.92em}
  input[type=text],input[type=password],input[type=datetime-local],textarea,select{
    background:var(--card2);border:1px solid var(--line);color:var(--text);
    border-radius:8px;padding:10px;font-size:1em;width:100%}
  textarea{min-height:80px;resize:vertical}
  .go{background:var(--gold);color:#111;border:none;font-weight:600;padding:12px 18px;
      border-radius:10px;font-size:1em;cursor:pointer;width:100%;margin-top:8px}
  .go:disabled{opacity:.5;cursor:not-allowed}
  .status{min-height:1.2em;font-size:.92em;margin:8px 0;color:var(--muted)}
  .status.ok{color:var(--green)} .status.err{color:var(--red)}
  .pend{border-top:1px solid var(--line);padding:9px 0;display:flex;
        justify-content:space-between;gap:8px;align-items:flex-start}
  .pend .meta{color:var(--muted);font-size:.85em}
  .pend .txt{font-size:.95em;word-break:break-word}
  .pend .del{background:none;border:1px solid var(--line);color:var(--red);
             border-radius:8px;padding:4px 9px;cursor:pointer;flex-shrink:0}
  .pend-empty{color:var(--muted);font-size:.92em}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;
         align-items:center;justify-content:center;padding:16px;z-index:10}
  .modal .box{background:var(--card);border:1px solid var(--line);border-radius:14px;
              padding:18px;width:100%;max-width:340px}
  .modal h3{margin:0 0 12px}
  .hint{color:var(--muted);font-size:.85em;margin-top:14px;text-align:center}
  .warn{color:var(--gold);font-size:.85em}
  .hidden{display:none !important}
</style>
</head>
<body>

<div class="top">
  <h1 style="margin:0">BL9D 💬</h1>
  <div>
    <button class="btn" id="btn-login-top" style="width:auto;display:inline-block">Вход 🔑</button>
    <button class="btn hidden" id="btn-logout" style="width:auto;display:inline-block">Выйти</button>
  </div>
</div>

<div class="section" id="sec-events">
  <h2>⚡ Быстрые события</h2>

  <div class="row" style="background:var(--card2);border:1px solid var(--line);
       border-radius:10px;padding:10px">
    <input type="checkbox" id="sched-on" style="width:auto">
    <label for="sched-on" style="color:var(--text)">⏰ Запланировать на:</label>
    <input type="datetime-local" id="sched-time" style="flex:1;min-width:150px">
  </div>
  <div class="warn" id="sched-hint" style="margin:6px 0 2px"></div>

  <button class="btn" data-btn="excavations">⛏️ Раскопки</button>
  <button class="btn" data-btn="ambush">🏹 Засада <span class="lock">🔒</span></button>
  <button class="btn" data-btn="siege">🏰 Осада <span class="lock">🔒</span></button>
  <button class="btn" data-btn="pandora_a">📦 Пандора А <span class="lock">🔒</span></button>
  <button class="btn" data-btn="pandora_b">📦 Пандора Б <span class="lock">🔒</span></button>
</div>

<div class="section">
  <h2>✉️ Своё сообщение</h2>
  <textarea id="custom-text" placeholder="Текст объявления (до 1800 символов)"></textarea>
  <div class="row">
    <label>Куда:</label>
    <select id="custom-channel">
      <option value="2">Объявления</option>
      <option value="1">Раскопки</option>
    </select>
  </div>
  <div class="row">
    <label>По расписанию:</label>
    <input type="datetime-local" id="custom-time" style="flex:1;min-width:170px">
  </div>
  <button class="go" id="btn-custom">Отправить</button>
</div>

<div class="section">
  <h2>⏳ Запланированные отправки</h2>
  <div id="pend-list"><div class="pend-empty">Пока ничего не запланировано</div></div>
</div>

<div class="status" id="status"></div>

<p class="hint">📱 На телефоне: меню браузера → «Добавить на главный экран» — и страничка станет приложением с иконкой.</p>

<div class="modal hidden" id="login-modal">
  <div class="box">
    <h3>🔑 Вход</h3>
    <input type="password" id="login-pass" placeholder="Пароль">
    <button class="go" id="btn-login">Войти</button>
    <button class="btn" id="btn-later" style="text-align:center">Позже</button>
  </div>
</div>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var BUTTONS = ["excavations","ambush","siege","pandora_a","pandora_b"];
var COOLDOWN_DEFAULT = 15;
var state = { authed:false, guest_mode:false, cooldowns:{}, stateOk:true };

function show(msg, cls){
  var s = $("status");
  s.textContent = msg || "";
  s.className = "status" + (cls ? " " + cls : "");
  if (msg) { clearTimeout(show._t); show._t = setTimeout(function(){ s.textContent=""; s.className="status"; }, 6000); }
}

function post(path, body){
  return fetch(path, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify(body || {})
  }).then(function(r){
    return r.json().then(function(data){ return {status:r.status, data:data}; });
  });
}

/* ---------- кулдауны на кнопках ---------- */
var cdDeadlines = {}; // key -> epoch(ms)

function applyCooldown(key, sec){
  if (!sec || sec < 1) sec = COOLDOWN_DEFAULT;
  cdDeadlines[key] = Date.now() + sec * 1000;
  renderButtons();
}

function cooldownLeft(key){
  var d = cdDeadlines[key];
  if (!d) return 0;
  var left = Math.ceil((d - Date.now()) / 1000);
  if (left <= 0) { delete cdDeadlines[key]; return 0; }
  return left;
}

function renderButtons(){
  BUTTONS.forEach(function(id){
    var btn = document.querySelector('[data-btn="'+id+'"]');
    if (!btn) return;
    var locked = state.guest_mode && !state.authed && id !== "excavations";
    var left = cooldownLeft(id);
    btn.disabled = locked || left > 0;
    var base = btn.getAttribute("data-label") || btn.textContent.replace(/\s*⏳.*$/,"").trim();
    btn.setAttribute("data-label", base);
    btn.textContent = base + (left > 0 ? "  ⏳ " + left + "с" : "");
    var lock = btn.querySelector(".lock") || null;
    // lock уже внутри base-текста; управлять нечем — просто текст
  });
  // замки управляются атрибутом: пересоберём текст по состоянию
  document.querySelectorAll(".btn[data-btn]").forEach(function(btn){
    var id = btn.getAttribute("data-btn");
    var base = btn.getAttribute("data-label") || "";
    if (base) {
      var locked = state.guest_mode && !state.authed && id !== "excavations";
      var label = base.replace(/ ?🔒$/,"");
      btn.setAttribute("data-label", label + (locked ? " 🔒" : ""));
      btn.textContent = (label + (locked ? " 🔒" : "")) + (cooldownLeft(id) > 0 ? "  ⏳ " + cooldownLeft(id) + "с" : "");
    }
  });
}
setInterval(renderButtons, 1000);

/* ---------- время для планирования: всегда с поясом ---------- */
function isoFromInput(value){
  if (!value) return null;
  var d = new Date(value);           // datetime-local читается в местном поясе
  if (isNaN(d.getTime())) return null;
  return d.toISOString();            // отдаём UTC — сервер принимает Z-формат
}

/* ---------- отправка кнопки (сразу или по расписанию) ---------- */
function sendEvent(id){
  var body = { button: id };
  if ($("sched-on").checked) {
    var iso = isoFromInput($("sched-time").value);
    if (!iso) { show("❌ Укажите время для запланированной отправки", "err"); return; }
    body.scheduled = iso;
  }
  post("/api/send", body).then(function(r){
    if (r.status === 429) {
      applyCooldown(id, r.data.wait);
      show("⏳ " + r.data.error + (r.data.wait ? " (ещё " + r.data.wait + " с)" : ""), "err");
    } else if (r.status === 200) {
      if (r.data.scheduled) {
        show("⏰ Запланировано на " + r.data.scheduled, "ok");
        $("sched-on").checked = false;
        $("sched-hint").textContent = "";
      } else {
        applyCooldown(id, r.data.wait || COOLDOWN_DEFAULT);
        show("✅ Отправлено", "ok");
      }
      refreshState();
    } else {
      show("❌ " + (r.data.error || "ошибка"), "err");
      if (r.status === 401) openLogin();
    }
  }).catch(function(){ show("❌ Сервер недоступен", "err"); });
}

/* ---------- своё сообщение ---------- */
$("btn-custom").addEventListener("click", function(){
  var text = $("custom-text").value.trim();
  var body = { button:"custom", text:text, channel: parseInt($("custom-channel").value, 10) };
  var iso = isoFromInput($("custom-time").value);
  if (iso) body.scheduled = iso;
  post("/api/send", body).then(function(r){
    if (r.status === 429) {
      applyCooldown("custom:"+text, r.data.wait);
      show("⏳ " + r.data.error, "err");
    } else if (r.status === 200) {
      if (r.data.scheduled) show("⏰ Запланировано на " + r.data.scheduled, "ok");
      else { show("✅ Отправлено", "ok"); $("custom-text").value = ""; }
      refreshState();
    } else {
      show("❌ " + (r.data.error || "ошибка"), "err");
      if (r.status === 401) openLogin();
    }
  }).catch(function(){ show("❌ Сервер недоступен", "err"); });
});

/* ---------- состояние: кулдауны + список запланированных ---------- */
function renderPending(){
  var box = $("pend-list");
  if (!state.pending || !state.pending.length) {
    box.innerHTML = '<div class="pend-empty">Пока ничего не запланировано</div>';
    return;
  }
  box.innerHTML = "";
  state.pending.forEach(function(p){
    var row = document.createElement("div");
    row.className = "pend";
    var chan = p.channel === 1 ? "Канал 1" : "Канал 2";
    var left = document.createElement("div");
    left.innerHTML = '<div class="meta">🕐 ' + p.when_str + " · " + chan + "</div>" +
                     '<div class="txt"></div>';
    left.querySelector(".txt").textContent = p.text;
    row.appendChild(left);
    if (state.authed) {
      var del = document.createElement("button");
      del.className = "del"; del.textContent = "✕";
      del.addEventListener("click", function(){
        post("/api/cancel", { key: p.key }).then(function(r){
          if (r.status === 200) { show("Отменено", "ok"); refreshState(); }
          else show("❌ " + (r.data.error || "ошибка"), "err");
        });
      });
      row.appendChild(del);
    }
    box.appendChild(row);
  });
}

function refreshState(){
  return fetch("/api/state").then(function(r){ return r.json(); }).then(function(data){
    state.authed = !!data.authed;
    state.guest_mode = !!data.guest_mode;
    state.pending = data.pending || [];
    if (data.cooldowns) {
      Object.keys(data.cooldowns).forEach(function(key){
        applyCooldown(key, data.cooldowns[key]);
      });
    }
    state.stateOk = true;
    $("sched-hint").textContent = "";
    renderButtons();
    renderPending();
    updateAuthUI();
  }).catch(function(){
    if (state.stateOk) {
      state.stateOk = false;
      $("sched-hint").textContent = "⚠ Не удалось получить состояние сервера — запланированные не видны";
    }
  });
}
setInterval(refreshState, 15000);

/* ---------- вход/выход ---------- */
function updateAuthUI(){
  $("btn-login-top").classList.toggle("hidden", state.authed || !state.guest_mode);
  $("btn-logout").classList.toggle("hidden", !state.authed);
  renderButtons();
}

function openLogin(){ $("login-modal").classList.remove("hidden"); $("login-pass").focus(); }
$("btn-login-top").addEventListener("click", openLogin);
$("btn-later").addEventListener("click", function(){ $("login-modal").classList.add("hidden"); });
$("btn-login").addEventListener("click", function(){
  post("/api/login", { password: $("login-pass").value }).then(function(r){
    if (r.status === 200) {
      $("login-modal").classList.add("hidden");
      $("login-pass").value = "";
      show("✅ Вход выполнен", "ok");
      refreshState();
    } else show("❌ " + (r.data.error || "ошибка входа"), "err");
  });
});
$("btn-logout").addEventListener("click", function(){
  post("/api/logout", {}).then(function(){
    show("Вы вышли", "ok");
    refreshState();
  });
});

/* ---------- клики по кнопкам событий ---------- */
document.querySelectorAll(".btn[data-btn]").forEach(function(btn){
  btn.addEventListener("click", function(){
    var id = btn.getAttribute("data-btn");
    if (state.guest_mode && !state.authed && id !== "excavations") { openLogin(); return; }
    if (cooldownLeft(id) > 0) return;
    sendEvent(id);
  });
});

/* подсказка у переключателя */
$("sched-on").addEventListener("change", function(){
  $("sched-hint").textContent = this.checked && !$("sched-time").value
    ? "Выберите дату и время — после этого клик по кнопке запланирует её" : "";
});

refreshState();
})();
</script>
</body>
</html>
